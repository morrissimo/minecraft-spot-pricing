AWSTemplateFormatVersion: "2010-09-09"
Description: Minecraft Spot Price Server via Docker / ECS
Parameters:
  ECSAMI:
    Description: "AWS ECS-optimized AMI (SSM path). AL2 is EOL 2026-06-30, so default is AL2023. NOTE: the Bedrock server binary is x86-only — do NOT point this at an arm64 AMI for a Bedrock server."
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ecs/optimized-ami/amazon-linux-2023/recommended/image_id

  ServerState:
    Type: String
    Description: "Running: A spot instance will launch shortly after setting this parameter; your Minecraft server should start within 5-10 minutes of changing this parameter (once UPDATE_IN_PROGRESS becomes UPDATE_COMPLETE). Stopped: Your spot instance (and thus Minecraft container) will be terminated shortly after setting this parameter."
    Default: Running
    AllowedValues:
      - Running
      - Stopped

  ServerShutdownAnnounceDelay:
    Type: Number
    Description: Number of seconds (0-60) to wait between announcing that the server will be shut down and actual shutdown. Defaults to 30; set to 0 to disable (STOP_SERVER_ANNOUNCE_DELAY)
    Default: 30
    MinValue: 0
    MaxValue: 60

  BedrockOrJava:
    Type: String
    Description: Should this be a Bedrock or Java server? Note that lots of other options here only apply to Java servers
    Default: Java
    AllowedValues:
      - Java
      - Bedrock

  InstanceType:
    Type: String
    Description: "t3.medium is a good cost effective instance, 1 VCPU and 3.75 GB of RAM with moderate network performance. Change at your discretion. https://aws.amazon.com/ec2/instance-types/."
    Default: m5.large

  SpotPrice:
    Type: Number
    Description: "A t3.medium shouldn't cost more than a cent per hour. Note: Leave this blank to use on-demand pricing."
    Default: 0.03
    MinValue: 0.0125

  KeyPairName:
    Type: String
    Description: (Optional - An empty value disables this feature)
    Default: ""

  YourIPv4:
    Type: String
    Description: (Optional - An empty value disables this feature)
    Default: ""

  YourIPv6:
    Type: String
    Description: (Optional - An empty value disables this feature)
    Default: ""

  HostedZoneId:
    Type: String
    Description: (Optional - An empty value disables this feature) If you have a hosted zone in Route 53 and wish to set a DNS record whenever your Minecraft instance starts, supply the hosted zone ID here.
    Default: ""

  RecordName:
    Type: String
    Description: (Optional - An empty value disables this feature) If you have a hosted zone in Route 53 and wish to set a DNS record whenever your Minecraft instance starts, supply the name of the record here (e.g. minecraft.mydomain.com).
    Default: ""

  MinecraftImageTag:
    Type: String
    Description: "Java version (Examples include latest, java8-multiarch, etc). Only applies to Java servers. Refer to tag descriptions available here: https://github.com/itzg/docker-minecraft-server)"
    Default: "latest"
    AllowedValues:
      - latest
      - java8-multiarch
      - java11
      - java16
      - multiarch-latest

  BedrockImageTag:
    Type: String
    Description: "itzg/minecraft-bedrock-server tag. Only applies to Bedrock servers. Default latest; pin a release (e.g. 2026.10.2) to hold the image back. Requires itzg >= 2026.10.0 for NetherNet (TRANSPORT, SERVER_UDP_PORTS, <public_ip>)."
    Default: "latest"

  BedrockTransport:
    Type: String
    Description: "BDS transport. nethernet = TCP server-port signaling + UDP gameplay range (BDS 1.26.50+ default). raknet = legacy UDP 19132 (deprecated by Mojang in 26.60; may stop working client-side). Only applies to Bedrock servers."
    Default: nethernet
    AllowedValues:
      - nethernet
      - raknet

  BedrockUdpPortStart:
    Type: Number
    Description: "First UDP port of the NetherNet gameplay range (one port per connected client; range size should be >= MaxPlayers)."
    Default: 19140

  BedrockUdpPortEnd:
    Type: Number
    Description: "Last UDP port of the NetherNet gameplay range (inclusive)."
    Default: 19171

  SignalingTls:
    Type: String
    Description: "NetherNet only. true = run a TLS-terminating proxy (Traefik) on TCP 19132 with a Let's Encrypt cert for RecordName (ACME DNS-01 on HostedZoneId) and move BDS signaling to BedrockSignalingBackendPort. Plain HTTP on 19132 keeps working as a fallback (players who connect that way still get the trust-on-first-use prompt). Requires HostedZoneId and RecordName. false = today's behavior."
    Default: "false"
    AllowedValues:
      - "true"
      - "false"

  SignalingTlsEmail:
    Type: String
    Description: "(Optional) ACME account email for Let's Encrypt expiry notices. Only used when SignalingTls=true."
    Default: ""

  SignalingTlsAcmeCa:
    Type: String
    Description: "ACME CA for SignalingTls. staging issues untrusted test certs with high rate limits (use for test stacks); production = Let's Encrypt."
    Default: production
    AllowedValues:
      - production
      - staging

  BedrockSignalingBackendPort:
    Type: Number
    Description: "TCP port BDS signaling listens on behind the proxy (SERVER_PORT) when SignalingTls=true. Loopback only; not opened in the security group. Must differ from 19132."
    Default: 19133
    MinValue: 1024
    MaxValue: 65535

  SignalingProxyImageTag:
    Type: String
    Description: "traefik image tag for the signaling proxy. Pin a minor (e.g. v3.7) so patch releases are picked up on relaunch but majors are not."
    Default: "v3.7"

  MinecraftTypeTag:
    Type: String
    Description: "(Examples include CURSEFORGE, SPIGOT, BUKKIT, TUINITY, etc) Refer to tag descriptions available here: https://github.com/itzg/docker-minecraft-server)"

  CurseForgeModpackS3Bucket:
    Type: String
    Description: "REQUIRED if server type is CURSEFORGE"
    Default: ""

  CurseForgeModpackS3Key:
    Type: String
    Description: "REQUIRED if server type is CURSEFORGE. The prefix/key of the Curseforge modpack server zip, manually downloaded and saved here"

  AdminPlayerNames:
    Type: String
    Description: Op/Administrator Players
    Default: ""

  Difficulty:
    Type: String
    Description: "The game's difficulty"
    Default: normal
    AllowedValues:
      - peaceful
      - easy
      - normal
      - hard

  Whitelist:
    Type: String
    Description: Usernames of your friends
    Default: ""

  OnlineMode:
    Type: String
    Description: "If true then all connected players must be authenticated to Xbox Live."
    Default: true
    AllowedValues:
      - true
      - false

  AllowCheats:
    Type: String
    Description: "If true then cheats like commands can be used. Bedrock edition servers only"
    Default: false
    AllowedValues:
      - true
      - false

  MinecraftVersion:
    Type: String
    Description: Server minecraft version. Not used for modpack servers. Bedrock servers should not use subminor versions, but can also use LATEST
    Default: ""

  Memory:
    Type: String
    Description: How much Memory to allocate for the JVM. Never use more than 75-80% of your server's total memory!
    Default: "6.5G"

  UseAikarsFlags:
    Type: String
    Description: "Enable a set of finely-tuned Java memory & GC optimization flags. Details here https://github.com/itzg/docker-minecraft-server#enable-aikars-flags"
    Default: false
    AllowedValues:
      - true
      - false

  Seed:
    Type: String
    Description: The seed used to generate the world

  MaxPlayers:
    Type: Number
    Description: Max number of players that can connect simultaneously (default 20)
    Default: 20

  ViewDistance:
    Type: Number
    Description: Max view radius (in chunks) the server will send to the client (default 10)
    Default: 10

  GameMode:
    Type: String
    Description: "Options: creative, survival (default), adventure, spectator (v1.8+)"
    Default: survival
    AllowedValues:
      - creative
      - survival
      - adventure
      - spectator

  LevelType:
    Type: String
    Description: "Options: DEFAULT, FLAT, LARGEBIOMES, AMPLIFIED, CUSTOMIZED, BUFFET, BIOMESOP (v1.12-), BIOMESOPLENTY (v1.15+), TERRAFORGED (certain modpacks only!)"
    Default: DEFAULT
    AllowedValues:
      - DEFAULT
      - FLAT
      - LARGEBIOMES
      - AMPLIFIED
      - CUSTOMIZED
      - BUFFET
      - BIOMESOP
      - BIOMESOPLENTY
      - TERRAFORGED

  EnableRollingLogs:
    Type: String
    Description: "If false, the log file will grow without limit. Set to true to use a rolling log strategy."
    Default: true
    AllowedValues:
      - true
      - false

  Timezone:
    Type: String
    Description: "Change the server's timezone. Use the canonical name of the format: Area/Location (e.g. America/New_York)"
    Default: "America/New_York"

  ServerBrand:
    Type: String
    Description: "Branding prefix shown in the server list name, e.g. your server-group name. Combined with a >>BEDROCK<< suffix automatically."
    Default: "Minecraft"

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Essential Configuration
        Parameters:
          - BedrockOrJava
          - ServerState
          - InstanceType
          - SpotPrice
          - Memory
      - Label:
          default: Server Settings
        Parameters:
          - MinecraftVersion
          - Difficulty
          - Whitelist
          - OnlineMode
          - AllowCheats
          - Seed
          - MaxPlayers
          - ViewDistance
          - GameMode
          - LevelType
          - EnableRollingLogs
          - Timezone
          - ServerShutdownAnnounceDelay
      - Label:
          default: Server Settings (Java only)
        Parameters:
          - MinecraftImageTag
          - MinecraftTypeTag
          - CurseForgeModpackS3Bucket
          - CurseForgeModpackS3Key
          - AdminPlayerNames
          - UseAikarsFlags
      - Label:
          default: Server Settings (Bedrock only)
        Parameters:
          - AllowCheats
          - BedrockImageTag
          - BedrockTransport
          - BedrockUdpPortStart
          - BedrockUdpPortEnd
          - SignalingTls
          - SignalingTlsEmail
          - SignalingTlsAcmeCa
          - BedrockSignalingBackendPort
          - SignalingProxyImageTag
      - Label:
          default: Optional Remote Access (SSH) Configuration
        Parameters:
          - KeyPairName
          - YourIPv4
          - YourIPv6
      - Label:
          default: Optional DNS Configuration
        Parameters:
          - HostedZoneId
          - RecordName
    ParameterLabels:
      ServerState:
        default: "Update this parameter to shut down / start up your Minecraft server as required to save on cost. Takes a few minutes to take effect."
      InstanceType:
        default: "Which instance type? You must make sure this is available in your region! https://aws.amazon.com/ec2/pricing/on-demand/"
      SpotPrice:
        default: "Maximum spot price per hour? Leave blank to disable spot pricing."
      MinecraftImageTag:
        default: "Which version of Java do you want to use to run Minecraft?"
      MinecraftTypeTag:
        default: "Which type of Minecraft do you want to launch?"
      AdminPlayerNames:
        default: "A comma delimited list (no spaces) of player names to be admins"
      Difficulty:
        default: "Which difficulty?"
      Whitelist:
        default: "A comma delimited list (no spaces) of player names"
      MinecraftVersion:
        default: "Minecraft version ie 1.16.3 - if you're running a modpack, make sure to use a compatible Minecraft version"
      KeyPairName:
        default: "If you wish to access the instance via SSH, select a Key Pair to use. https://console.aws.amazon.com/ec2/v2/home?#KeyPairs:sort=keyName"
      YourIPv4:
        default: "If you wish to access the instance via SSH and using IPv4, provide it."
      YourIPv6:
        default: "If you wish to access the instance via SSH and using IPv6, provide it."
      HostedZoneId:
        default: "If you have a hosted zone in Route 53 and wish to update a DNS record whenever your Minecraft instance starts, supply the hosted zone ID here."
      RecordName:
        default: "If you have a hosted zone in Route 53 and wish to set a DNS record whenever your Minecraft instance starts, supply a record name here (e.g. minecraft.mydomain.com)."
      Memory:
        default: "If you wish to increase the Java memory-heap limit of 1GB. Format: <size>[g|G|m|M|k|K]"
      Seed:
        default: "Seed for world generation"
      MaxPlayers:
        default: "Max simultaneous players"
      ViewDistance:
        default: "Max view distance"
      GameMode:
        default: "The Minecraft game mode"
      LevelType:
        default: "Level type for world generation"
      EnableRollingLogs:
        default: "Whether to enable rolling logs"
      Timezone:
        default: "The server's timezone"
      ServerShutdownAnnounceDelay:
        default: "Server shutdown warning"

Conditions:
  MinecraftTypeTagProvided: !Not [!Equals [!Ref MinecraftTypeTag, ""]]
  IsBedrock: !Equals [!Ref BedrockOrJava, "Bedrock"]
  IsNetherNet: !And
    - !Equals [!Ref BedrockOrJava, "Bedrock"]
    - !Equals [!Ref BedrockTransport, "nethernet"]
  # TLS signaling proxy; only meaningful under NetherNet (under RakNet there is no TCP signaling).
  SignalingTlsEnabled: !And
    - !Condition IsNetherNet
    - !Equals [!Ref SignalingTls, "true"]
  SignalingTlsEmailProvided: !Not [!Equals [!Ref SignalingTlsEmail, ""]]
  CurseForgeModpackS3UrlProvided:
    !And [
      !Equals [!Ref MinecraftTypeTag, "CURSEFORGE"],
      !Not [!Equals [!Ref CurseForgeModpackS3Bucket, ""]],
      !Not [!Equals [!Ref CurseForgeModpackS3Key, ""]],
      !Not [!Equals [!Ref BedrockOrJava, "Bedrock"]],
    ]
  AdminPlayerNamesProvided: !Not [!Equals [!Ref AdminPlayerNames, ""]]
  DifficultyProvided: !Not [!Equals [!Ref Difficulty, ""]]
  WhitelistProvided: !Not [!Equals [!Ref Whitelist, ""]]
  MinecraftVersionProvided: !Not [!Equals [!Ref MinecraftVersion, ""]]
  KeyPairNameProvided: !Not [!Equals [!Ref KeyPairName, ""]]
  IPv4AddressProvided: !Not [!Equals [!Ref YourIPv4, ""]]
  IPv6AddressProvided: !Not [!Equals [!Ref YourIPv6, ""]]
  DnsConfigEnabled:
    !And [
      !Not [!Equals [!Ref HostedZoneId, ""]],
      !Not [!Equals [!Ref RecordName, ""]],
    ]
  SpotPriceProvided: !Not [!Equals [!Ref SpotPrice, ""]]
  MemoryProvided: !Not [!Equals [!Ref Memory, ""]]
  SeedProvided: !Not [!Equals [!Ref Seed, ""]]
  MaxPlayersProvided: !Not [!Equals [!Ref MaxPlayers, ""]]
  ViewDistanceProvided: !Not [!Equals [!Ref ViewDistance, ""]]
  GameModeProvided: !Not [!Equals [!Ref GameMode, ""]]
  LevelTypeProvided: !Not [!Equals [!Ref LevelType, ""]]
  EnableRollingLogsProvided: !Not [!Equals [!Ref EnableRollingLogs, ""]]
  TimezoneProvided: !Not [!Equals [!Ref Timezone, ""]]

Mappings:
  ServerState:
    Running:
      DesiredCapacity: 1
    Stopped:
      DesiredCapacity: 0
  ServerPort:
    Bedrock:
      Port: 19132
    Java:
      Port: 25565
  AcmeCa:
    production:
      Url: "https://acme-v02.api.letsencrypt.org/directory"
    staging:
      Url: "https://acme-staging-v02.api.letsencrypt.org/directory"

# Fail at validation, not at runtime: the proxy's DNS-01 challenge needs the zone and the record name.
Rules:
  SignalingTlsNeedsDns:
    RuleCondition: !Equals [!Ref SignalingTls, "true"]
    Assertions:
      - Assert: !And
          - !Not [!Equals [!Ref HostedZoneId, ""]]
          - !Not [!Equals [!Ref RecordName, ""]]
        AssertDescription: "SignalingTls=true requires HostedZoneId and RecordName."

Resources:
  # ====================================================
  # BASIC VPC
  # ====================================================

  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.100.0.0/26
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}"

  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select
        - 0
        - !GetAZs
          Ref: "AWS::Region"
      CidrBlock: !Select [0, !Cidr [10.100.0.0/26, 4, 4]]
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-a"

  SubnetARoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref RouteTable
      SubnetId: !Ref SubnetA

  SubnetBRoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref RouteTable
      SubnetId: !Ref SubnetB

  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select
        - 1
        - !GetAZs
          Ref: "AWS::Region"
      CidrBlock: !Select [1, !Cidr [10.100.0.0/26, 4, 4]]
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-b"

  SubnetC:
    Type: AWS::EC2::Subnet
    DeletionPolicy: Delete
    Properties:
      AvailabilityZone: !Select
        - 2
        - !GetAZs
          Ref: "AWS::Region"
      CidrBlock: !Select [2, !Cidr [10.100.0.0/26, 4, 4]]
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-c"

  SubnetCRoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    DeletionPolicy: Delete
    Properties:
      RouteTableId: !Ref RouteTable
      SubnetId: !Ref SubnetC

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-igw"

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref Vpc

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-rt"

  Route:
    Type: AWS::EC2::Route
    Properties:
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
      RouteTableId: !Ref RouteTable

  # ====================================================
  # EFS FOR PERSISTENT DATA
  # ====================================================

  EfsSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${AWS::StackName}-efs"
      GroupDescription: !Sub "${AWS::StackName}-efs"
      SecurityGroupIngress:
        - FromPort: 2049
          ToPort: 2049
          IpProtocol: tcp
          SourceSecurityGroupId: !Ref Ec2Sg
      VpcId: !Ref Vpc

  # ====================================================
  # EfsMinecraftRoot - for core minecraft files
  # ====================================================

  EfsMCRoot:
    Type: AWS::EFS::FileSystem
    Properties: {}

  MountRootA:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref EfsMCRoot
      SecurityGroups:
        - !Ref EfsSg
      SubnetId: !Ref SubnetA

  MountRootB:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref EfsMCRoot
      SecurityGroups:
        - !Ref EfsSg
      SubnetId: !Ref SubnetB

  # ====================================================
  # EfsMCModpacks - for core minecraft files
  # ====================================================

  EfsMCModpacks:
    Type: AWS::EFS::FileSystem
    Properties: {}

  MountModpacksA:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref EfsMCModpacks
      SecurityGroups:
        - !Ref EfsSg
      SubnetId: !Ref SubnetA

  MountModpacksB:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref EfsMCModpacks
      SecurityGroups:
        - !Ref EfsSg
      SubnetId: !Ref SubnetB

  MountRootC:
    Type: AWS::EFS::MountTarget
    DeletionPolicy: Delete
    Properties:
      FileSystemId: !Ref EfsMCRoot
      SecurityGroups:
        - !Ref EfsSg
      SubnetId: !Ref SubnetC

  MountModpacksC:
    Type: AWS::EFS::MountTarget
    DeletionPolicy: Delete
    Properties:
      FileSystemId: !Ref EfsMCModpacks
      SecurityGroups:
        - !Ref EfsSg
      SubnetId: !Ref SubnetC

  # ====================================================
  # INSTANCE CONFIG
  # ====================================================

  Ec2Sg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${AWS::StackName}-ec2"
      GroupDescription: !Sub "${AWS::StackName}-ec2"
      SecurityGroupIngress:
        - !If
          - IPv4AddressProvided
          - FromPort: 22
            ToPort: 22
            IpProtocol: tcp
            CidrIp: !Sub "${YourIPv4}/32"
          - !Ref "AWS::NoValue"
        - !If
          - IPv6AddressProvided
          - FromPort: 22
            ToPort: 22
            IpProtocol: tcp
            CidrIpv6: !Sub "${YourIPv6}/128"
          - !Ref "AWS::NoValue"
        - FromPort: !FindInMap [ServerPort, !Ref BedrockOrJava, Port]
          ToPort: !FindInMap [ServerPort, !Ref BedrockOrJava, Port]
          IpProtocol: !If [IsBedrock, "udp", "tcp"]
          CidrIp: 0.0.0.0/0
        # NetherNet. The UDP 19132 rule above stays under
        # NetherNet so a BedrockTransport=raknet rollback is a parameter flip, not an SG change.
        - !If
          - IsNetherNet
          - FromPort: 19132
            ToPort: 19132
            IpProtocol: tcp # NetherNet HTTP signaling (GET /v1/join, POST /v1/join/{id})
            CidrIp: 0.0.0.0/0
          - !Ref "AWS::NoValue"
        - !If
          - IsNetherNet
          - FromPort: !Ref BedrockUdpPortStart
            ToPort: !Ref BedrockUdpPortEnd
            IpProtocol: udp # NetherNet WebRTC/ICE gameplay, one port per client
            CidrIp: 0.0.0.0/0
          - !Ref "AWS::NoValue"
      VpcId: !Ref Vpc

  # NOTE: LaunchConfiguration is deprecated and newer AWS accounts can no longer create one.
  # Uses AWS::EC2::LaunchTemplate per the AWS migration guide:
  #   https://docs.aws.amazon.com/autoscaling/ec2/userguide/migrate-launch-configurations-with-cloudformation.html
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "${AWS::StackName}-launchtemplate"
      LaunchTemplateData:
        ImageId: !Ref ECSAMI
        InstanceType: !Ref InstanceType
        IamInstanceProfile:
          Arn: !GetAtt InstanceProfile.Arn
        KeyName: !If [KeyPairNameProvided, !Ref KeyPairName, !Ref "AWS::NoValue"]
        InstanceMarketOptions:
          MarketType: spot
          SpotOptions:
            SpotInstanceType: one-time
            MaxPrice: !If [SpotPriceProvided, !Ref SpotPrice, !Ref "AWS::NoValue"]
        NetworkInterfaces:
          - DeviceIndex: 0
            AssociatePublicIpAddress: true
            Groups:
              - !Ref Ec2Sg
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash -xe

            # update everything
            yum update -y
            yum clean all -y

            # install AWS stuff
            yum install -y amazon-efs-utils
            yum install -y unzip wget vim
            # NOTE: no `pip3 install awscli` — it aborts the AL2023 boot (bash -xe) and the
            # AL2023 ECS-optimized AMI already ships the AWS CLI. (Only the unused CURSEFORGE
            # S3 path below needs it anyway.)

            # configure ECS
            echo ECS_CLUSTER=${EcsCluster} >> /etc/ecs/ecs.config
            # Spot draining: on an EC2 Spot interruption notice, have the ECS agent
            # gracefully STOP the task (SIGTERM honoring the container StopTimeout)
            # instead of letting the container be hard-killed at instance reclaim.
            # REQUIRED for the native graceful announce-before-shutdown (STOP_SERVER_ANNOUNCE_DELAY,
            # itzg entrypoint) to fire on Spot reclaims — without this, Spot = boom.
            # (Manual `docker stop` / ECS deploys send SIGTERM regardless; this is the
            # Spot-interruption path specifically.) Applies on the NEXT instance launch.
            echo ECS_ENABLE_SPOT_INSTANCE_DRAINING=true >> /etc/ecs/ecs.config

            # mount root volume
            mkdir /opt/minecraft
            mount -t efs ${EfsMCRoot}:/ /opt/minecraft
            chown ec2-user:ec2-user /opt/minecraft

            # ### THIS EFS MOUNT APPROACH DOESN'T WORK WITH DOCKER no clue why :anger:
            # mount modpacks volume
            #mkdir /opt/modpacks
            #mount -t efs ${EfsMCModpacks}:/ /opt/modpacks
            #chown ec2-user:ec2-user /opt/modpacks

            # ### ...SO TRY THIS INSTEAD :/
            mkdir -p /tmp/modpacks

            # download curseforge modpack from S3, if configured to use one
            if [ -n "${CurseForgeModpackS3Key}" ] ; then
              echo "* Downloading curseforge modpack from s3://${CurseForgeModpackS3Bucket}/${CurseForgeModpackS3Key}"
              # curl doesn't work :shrug:
              # curl https://${CurseForgeModpackS3Bucket}.s3.${AWS::Region}.amazonaws.com/${CurseForgeModpackS3Key} -o /tmp/modpacks/${CurseForgeModpackS3Key}
              aws s3 cp s3://${CurseForgeModpackS3Bucket}/${CurseForgeModpackS3Key} /tmp/modpacks/
            fi

            # make sure permissions are gtg
            chown ec2-user:ec2-user -R /opt/minecraft
            chmod +r -R /opt/minecraft
            #chmod +r -R /opt/modpacks
            chown ec2-user:ec2-user -R /tmp/modpacks
            chmod +r -R /tmp/modpacks

  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn:
      - MountRootA
      - MountRootB
      - MountRootC
      #- MountModpacksA
      #- MountModpacksB
      #- MountModpacksC
    Properties:
      AutoScalingGroupName: !Sub "${AWS::StackName}-asg"
      DesiredCapacity:
        !FindInMap [ServerState, !Ref ServerState, DesiredCapacity]
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      MaxSize: !FindInMap [ServerState, !Ref ServerState, DesiredCapacity]
      MinSize: !FindInMap [ServerState, !Ref ServerState, DesiredCapacity]
      VPCZoneIdentifier:
        - !Ref SubnetA
        - !Ref SubnetB
        - !Ref SubnetC

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role
      Policies:
        - PolicyName: root
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: "Allow"
                Action: "route53:*"
                Resource: "*"
              - Effect: "Allow"
                Action:
                  - s3:Get*
                  - s3:List*
                Resource:
                  - !Sub "arn:aws:s3:::${CurseForgeModpackS3Bucket}"
                  - !Sub "arn:aws:s3:::${CurseForgeModpackS3Bucket}/*"

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${AWS::StackName}-cluster"

  EcsService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref EcsCluster
      DesiredCount: !FindInMap [ServerState, !Ref ServerState, DesiredCapacity]
      ServiceName: !Sub "${AWS::StackName}-ecs-service"
      TaskDefinition: !Ref EcsTask
      DeploymentConfiguration:
        MaximumPercent: 100
        MinimumHealthyPercent: 0

  EcsTaskLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${AWS::StackName}"
      # LogGroupClass: STANDARD | INFREQUENT_ACCESS
      LogGroupClass: STANDARD
      RetentionInDays: 30

  EcsTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      # host: BDS binds the instance's ports directly; no docker-proxy, no 32-entry mapping list.
      # SERVER_UDP_PORTS must still carry the public IP (EC2 public IP is NAT'd). Unset otherwise
      # (keeps the default bridge mode for RakNet/Java).
      NetworkMode: !If [IsNetherNet, "host", !Ref "AWS::NoValue"]
      Volumes:
        - Host:
            SourcePath: /opt/minecraft
          Name: minecraft
        - Host:
            SourcePath: /tmp/modpacks
          Name: modpacks
        # ACME state + proxy config. /opt/minecraft is the EFS mount, so the cert survives spot
        # relaunches (a relaunch reuses it instead of re-ordering; Let's Encrypt allows only 5 new
        # certs per hostname per 7 days).
        - !If
          - SignalingTlsEnabled
          - Host:
              SourcePath: /opt/minecraft/tls
            Name: tls
          - !Ref "AWS::NoValue"
      ContainerDefinitions:
        - Name: minecraft
          MemoryReservation: 1024
          # need these to both be true to be able to connect to the server console
          PseudoTerminal: true
          Interactive: true
          # Image: !Sub "itzg/minecraft-server:${MinecraftImageTag}"
          #Image: !FindInMap [MinecraftBaseImage, !Ref BedrockOrJava, Image]
          Image: !If
            - IsBedrock
            - !Sub "itzg/minecraft-bedrock-server:${BedrockImageTag}"
            - !Sub "itzg/minecraft-server:${MinecraftImageTag}"
          # MinecraftBaseImage:
          #     Bedrock:
          #       Image: !Sub "itzg/minecraft-bedrock-server"
          #     Java:
          #       Image: !Sub "itzg/minecraft-server:${MinecraftImageTag}"
          StopTimeout: 100 # seconds; defaults to 30. Overrides ECS_CONTAINER_STOP_TIMEOUT in ECS agent config

          # Graceful announce-before-shutdown is now NATIVE in the itzg entrypoint
          # (itzg 2026.6.2, PR #651 by @morrissimo): with STOP_SERVER_ANNOUNCE_DELAY set
          # (env below), on SIGTERM the server announces, waits the delay, then stops +
          # saves cleanly. The prior EntryPoint override that wired this by hand was retired
          # 2026-07-16 once the upstream flags shipped. StopTimeout (above) + Spot draining
          # (LaunchTemplate UserData) still bound the shutdown window (delay < 100s < 120s).

          PortMappings:
            - ContainerPort: !FindInMap [ServerPort, !Ref BedrockOrJava, Port]
              HostPort: !FindInMap [ServerPort, !Ref BedrockOrJava, Port]
              Protocol: !If [IsBedrock, "udp", "tcp"]
            # In host mode these are documentation (hostPort must equal containerPort). The UDP
            # gameplay range is not listed: BDS binds it directly and the SG rule opens it.
            - !If
              - IsNetherNet
              - ContainerPort: !If [SignalingTlsEnabled, !Ref BedrockSignalingBackendPort, 19132]
                HostPort: !If [SignalingTlsEnabled, !Ref BedrockSignalingBackendPort, 19132]
                Protocol: tcp
              - !Ref "AWS::NoValue"
          MountPoints:
            - ContainerPath: /data
              SourceVolume: minecraft
              ReadOnly: false
            - ContainerPath: /modpacks
              SourceVolume: modpacks
              ReadOnly: false
          LogConfiguration:
            LogDriver: awslogs
            Options:
              mode: non-blocking
              max-buffer-size: 25m
              awslogs-group: !Ref EcsTaskLogGroup
              awslogs-region: !Ref AWS::Region
          Environment:
            - Name: "EULA"
              Value: "TRUE"
            # Bedrock server-name shown in the client's server list.
            # NOTE: Bedrock renders this as a single line; § color codes are supported by
            # modern clients but verify in-client. Brand comes from the ServerBrand parameter.
            - Name: "SERVER_NAME"
              Value: !Sub "${ServerBrand} §b>>BEDROCK<<§r"
            # - Name: "MAX_TICK_TIME"
            #   Value: "-1" # set to -1 to disable the serverhangwatchdog
            - !If
              - IsBedrock
              - Name: "TRANSPORT"
                Value: !Ref BedrockTransport
              - !Ref "AWS::NoValue"
            - !If
              - IsNetherNet
              # <public_ip> is replaced by the itzg entrypoint at container start (curl -s ifconfig.me).
              # Form is IP:public-range:local-range; ranges must be the same size. IP LITERAL only
              # (a hostname makes the client join fail with "Door").
              - Name: "SERVER_UDP_PORTS"
                Value: !Sub "<public_ip>:${BedrockUdpPortStart}-${BedrockUdpPortEnd}:${BedrockUdpPortStart}-${BedrockUdpPortEnd}"
              - !Ref "AWS::NoValue"
            - !If
              - SignalingTlsEnabled
              # BDS signaling moves behind the TLS proxy, which owns 19132. Only under nethernet:
              # under RakNet server-port is the UDP game port.
              - Name: "SERVER_PORT"
                Value: !Ref BedrockSignalingBackendPort
              - !Ref "AWS::NoValue"
            - !If
              - MinecraftTypeTagProvided
              - Name: "TYPE"
                Value: !Sub "${MinecraftTypeTag}"
              - !Ref "AWS::NoValue"
            - !If
              - CurseForgeModpackS3UrlProvided
              - Name: "CF_SERVER_MOD"
                Value: !Sub "/modpacks/${CurseForgeModpackS3Key}"
              - !Ref "AWS::NoValue"
            - !If
              - AdminPlayerNamesProvided
              - Name: "OPS"
                Value: !Sub "${AdminPlayerNames}"
              - !Ref "AWS::NoValue"
            - !If
              - DifficultyProvided
              - Name: "DIFFICULTY"
                Value: !Sub "${Difficulty}"
              - !Ref "AWS::NoValue"
            - !If
              - WhitelistProvided
              - Name: "WHITELIST"
                Value: !Sub "${Whitelist}"
              - !Ref "AWS::NoValue"
            - !If
              - WhitelistProvided
              - Name: "WHITE_LIST_USERS" # different env var for the Bedrock image :/
                Value: !Sub "${Whitelist}"
              - !Ref "AWS::NoValue"
            - !If
              - MinecraftVersionProvided
              - Name: "VERSION"
                Value: !Sub "${MinecraftVersion}"
              - !Ref "AWS::NoValue"
            - !If
              - MemoryProvided
              - Name: "MEMORY"
                Value: !Sub "${Memory}"
              - !Ref "AWS::NoValue"
            - !If
              - SeedProvided
              - Name: "SEED"
                Value: !Sub "${Seed}"
              - !Ref "AWS::NoValue"
            - !If
              - MaxPlayersProvided
              - Name: "MAX_PLAYERS"
                Value: !Sub "${MaxPlayers}"
              - !Ref "AWS::NoValue"
            - !If
              - ViewDistanceProvided
              - Name: "VIEW_DISTANCE"
                Value: !Sub "${ViewDistance}"
              - !Ref "AWS::NoValue"
            - !If
              - GameModeProvided
              - Name: "MODE"
                Value: !Sub "${GameMode}"
              - !Ref "AWS::NoValue"
            - !If
              - LevelTypeProvided
              - Name: "LEVEL_TYPE"
                Value: !Sub "${LevelType}"
              - !Ref "AWS::NoValue"
            - !If
              - EnableRollingLogsProvided
              - Name: "ENABLE_ROLLING_LOGS"
                Value: !Sub "${EnableRollingLogs}"
              - !Ref "AWS::NoValue"
            - !If
              - TimezoneProvided
              - Name: "TZ"
                Value: !Sub "${Timezone}"
              - !Ref "AWS::NoValue"
            - Name: "STOP_SERVER_ANNOUNCE_DELAY"
              Value: !Sub "${ServerShutdownAnnounceDelay}"
            - Name: ENABLE_RCON
              Value: "TRUE"
            - Name: RCON_CMDS_STARTUP
              Value: |
                gamerule doFireTick false
                gamerule showCoordinates true
            - Name: RCON_CMDS_FIRST_CONNECT
              Value: |
                gamerule doFireTick true
            - Name: RCON_CMDS_LAST_DISCONNECT
              Value: |
                gamerule doFireTick false

        # --- NetherNet TLS signaling (SignalingTls=true) ---------------------------------------
        # Traefik listens on 19132 and serves BOTH TLS (terminated, proxied to BDS) and plain HTTP
        # (raw passthrough to BDS). A cert failure therefore degrades to the plain-HTTP trust
        # prompt instead of an outage. Mojang: HTTPS signaling with a valid cert = no trust prompt.
        # One-shot init: writes Traefik's dynamic config and fixes acme.json permissions (the
        # LaunchTemplate UserData runs `chmod +r -R /opt/minecraft` on every boot, which would
        # leave the ACME store world-readable and make Traefik refuse it).
        - !If
          - SignalingTlsEnabled
          - Name: signaling-proxy-init
            Image: busybox:stable
            Essential: false
            MemoryReservation: 16
            Command:
              - sh
              - -c
              - |
                set -e
                printf '%s\n' "$DYNAMIC_CONFIG" > /tls/dynamic.yml
                touch /tls/acme.json
                chmod 600 /tls/acme.json
            Environment:
              - Name: DYNAMIC_CONFIG
                Value: !Sub |
                  tcp:
                    routers:
                      nn-plain:
                        entryPoints: [nethernet]
                        rule: "HostSNI(`*`)"
                        service: bds-tcp
                    services:
                      bds-tcp:
                        loadBalancer:
                          servers:
                            - address: "127.0.0.1:${BedrockSignalingBackendPort}"
                  http:
                    routers:
                      nn-tls:
                        entryPoints: [nethernet]
                        rule: "PathPrefix(`/`)"
                        service: bds-http
                        tls:
                          certResolver: le
                          domains:
                            - main: "${RecordName}"
                    services:
                      bds-http:
                        loadBalancer:
                          servers:
                            - url: "http://127.0.0.1:${BedrockSignalingBackendPort}"
            MountPoints:
              - ContainerPath: /tls
                SourceVolume: tls
            LogConfiguration:
              LogDriver: awslogs
              Options:
                awslogs-group: !Ref EcsTaskLogGroup
                awslogs-region: !Ref AWS::Region
                awslogs-stream-prefix: proxy-init
          - !Ref "AWS::NoValue"
        - !If
          - SignalingTlsEnabled
          - Name: signaling-proxy
            Image: !Sub "traefik:${SignalingProxyImageTag}"
            # Essential: a dead proxy would leave BDS looking healthy while nobody can join.
            Essential: true
            MemoryReservation: 128
            DependsOn:
              - ContainerName: signaling-proxy-init
                Condition: SUCCESS
            PortMappings:
              # Host mode: documentation only (hostPort must equal containerPort).
              - ContainerPort: 19132
                HostPort: 19132
                Protocol: tcp
            Command:
              - --entrypoints.nethernet.address=:19132
              - --providers.file.filename=/tls/dynamic.yml
              - --certificatesresolvers.le.acme.dnschallenge.provider=route53
              - --certificatesresolvers.le.acme.storage=/tls/acme.json
              - !Sub
                - "--certificatesresolvers.le.acme.caserver=${Url}"
                - Url: !FindInMap [AcmeCa, !Ref SignalingTlsAcmeCa, Url]
              - !If
                - SignalingTlsEmailProvided
                - !Sub "--certificatesresolvers.le.acme.email=${SignalingTlsEmail}"
                - !Ref "AWS::NoValue"
              - --accesslog=true
              - --log.level=INFO
            Environment:
              # Credentials come from the EC2 instance role (lego's default chain).
              - Name: AWS_REGION
                Value: !Ref AWS::Region
              - Name: AWS_HOSTED_ZONE_ID
                Value: !Ref HostedZoneId
            MountPoints:
              - ContainerPath: /tls
                SourceVolume: tls
            LogConfiguration:
              LogDriver: awslogs
              Options:
                mode: non-blocking
                max-buffer-size: 25m
                awslogs-group: !Ref EcsTaskLogGroup
                awslogs-region: !Ref AWS::Region
                awslogs-stream-prefix: proxy
          - !Ref "AWS::NoValue"

  # ====================================================
  # SET DNS RECORD
  # ====================================================

  SetDNSRecordLambdaRole:
    Type: AWS::IAM::Role
    Condition: DnsConfigEnabled
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: root
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: "Allow"
                Action: "route53:*"
                Resource: "*"
              - Effect: "Allow"
                Action: "ec2:DescribeInstance*"
                Resource: "*"

  SetDNSRecordLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: DnsConfigEnabled
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-set-dns"
      RetentionInDays: 30

  SetDNSRecordLambda:
    Type: "AWS::Lambda::Function"
    Condition: DnsConfigEnabled
    DependsOn: SetDNSRecordLambdaLogGroup
    Properties:
      Environment:
        Variables:
          HostedZoneId: !Ref HostedZoneId
          RecordName: !Ref RecordName
      Code:
        ZipFile: |
          import boto3
          import os
          def handler(event, context):
            new_instance = boto3.resource('ec2').Instance(event['detail']['EC2InstanceId'])
            boto3.client('route53').change_resource_record_sets(
              HostedZoneId= os.environ['HostedZoneId'],
              ChangeBatch={
                  'Comment': 'updating',
                  'Changes': [
                      {
                          'Action': 'UPSERT',
                          'ResourceRecordSet': {
                              'Name': os.environ['RecordName'],
                              'Type': 'A',
                              'TTL': 60,
                              'ResourceRecords': [
                                  {
                                      'Value': new_instance.public_ip_address
                                  },
                              ]
                          }
                      },
                  ]
              })
      Description: Sets Route 53 DNS Record for Minecraft
      FunctionName: !Sub "${AWS::StackName}-set-dns"
      Handler: index.handler
      MemorySize: 128
      Role: !GetAtt SetDNSRecordLambdaRole.Arn
      Runtime: python3.12
      Timeout: 20

  LaunchEvent:
    Type: AWS::Events::Rule
    Condition: DnsConfigEnabled
    Properties:
      EventPattern:
        source:
          - aws.autoscaling
        detail-type:
          - EC2 Instance Launch Successful
        detail:
          AutoScalingGroupName:
            - !Ref AutoScalingGroup
      Name: !Sub "${AWS::StackName}-instance-launch"
      State: ENABLED
      Targets:
        - Arn: !GetAtt SetDNSRecordLambda.Arn
          Id: !Sub "${AWS::StackName}-set-dns"

  LaunchEventLambdaPermission:
    Type: AWS::Lambda::Permission
    Condition: DnsConfigEnabled
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt SetDNSRecordLambda.Arn
      Principal: events.amazonaws.com
      SourceArn: !GetAtt LaunchEvent.Arn

Outputs:
  CheckInstanceIp:
    Description: To find your Minecraft instance IP address, visit the following link. Click on the instance to find its Public IP address.
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/ec2/v2/home?region=${AWS::Region}#Instances:tag:aws:autoscaling:groupName=${AutoScalingGroup};sort=tag:Name"

